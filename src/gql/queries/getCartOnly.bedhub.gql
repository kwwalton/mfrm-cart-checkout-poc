query GetCartOnly($cartId: ID!) {
    cart(cartId: $cartId) {
        id
        dynamicsVersion
        count
        coupons {
            id
            type
        }
        discount
        recyclingFee
        tax
        subTotal
        total
        items {
            categoryId
            categoryName
            categoryUrl
            count
            coupons {
                id
                type
            }
            id
            price
            productBadges {
                label
                type
            }
            productBrand
            productEyebrow
            productId(type: DYNAMICS)
            itemID: productId(type: MFRM)
            productImage
            productName
            productPromo
            productRating
            productRatingCount
            productUrl
            variantAttributes
            barCode: variantId(type: MFRM)
            variantId(type: DYNAMICS)
            variantOriginalPrice
            variantPrice
            variantType
            variantUrl
        }
    }
}
